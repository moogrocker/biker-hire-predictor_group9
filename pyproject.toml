[project]
name = "biker-hire-predictor-group9"
version = "0.1.0"
description = "London bikes dashboard: data exploration and next-day demand prediction"
requires-python = ">=3.10"
dependencies = [
    "dash>=2.17",
    "plotly>=5.22",
    "pandas>=2.2",
    "requests>=2.32",
    "gunicorn>=22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["app.py", "data"]
